
trigger: none

variables:
  IISWebsiteName: 'AzureTestProject'

resources:
  pipelines:
    - pipeline: buildPipeline
      source: 'BuildPipeline'
      branch: main

stages:
  - stage: DeployWebsite
    displayName: 'Deploy website'
    pool: 
      vmImage: windows-latest

    jobs:
      - deployment: DeployWebsite
        displayName: 'Deploy website'
        environment: 'Windows 2022.Servidor01'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: buildPipeline
                  name: 'DownloadBuildArtifacts'
                  displayName: 'Download Build Artifacts'
                  artifact: 'AzureTestProject'

                - powershell: |
                    Write-Host "Pipeline Workspace: $(Pipeline.Workspace)"
                    Get-ChildItem -Path "$(Pipeline.Workspace)" -Recurse -File |
                      Select-Object -ExpandProperty FullName
                  displayName: 'List downloaded artifact files'

                - task: IISWebAppManagementOnMachineGroup@0
                  name: StopIIS
                  displayName: 'Stop IIS website'
                  inputs:
                    IISDeploymentType: 'IISWebsite'
                    ActionIISWebsite: 'StopWebsite'
                    StartStopWebsiteName: '$(IISWebsiteName)'

                - task: IISWebAppDeploymentOnMachineGroup@0
                  name: DeployIIS
                  displayName: 'Deploy IIS website'
                  inputs:
                    WebSiteName: '$(IISWebsiteName)'
                    Package: '$(Pipeline.Workspace)\buildPipeline\AzureTestProject\**\*.zip'
                    TakeAppOfflineFlag: true

                - task: IISWebAppManagementOnMachineGroup@0
                  name: StartIIS
                  displayName: 'Start IIS website'
                  condition: succeededOrFailed()
                  inputs:
                    IISDeploymentType: 'IISWebsite'
                    ActionIISWebsite: 'StartWebsite'
                    StartStopWebsiteName: '$(IISWebsiteName)'
